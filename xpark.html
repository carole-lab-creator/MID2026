<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b5c74">
<title>Xpark 入場名單</title>
<meta property="og:type" content="website">
<meta property="og:title" content="🐟 Xpark 入場名單">
<meta property="og:description" content="輸入英文名字，查詢您的 Xpark 入場人數與票種">
<meta property="og:image" content="https://carole-lab-creator.github.io/MID2026/trip-xpark.jpg">
<meta property="og:url" content="https://carole-lab-creator.github.io/MID2026/xpark.html">
<style>
  :root{
    --navy:#0f3d7a; --blue:#1e6fc4; --teal:#159fb3; --deep:#0b5c74; --sky:#e6f6fa;
    --ink:#1d2b3a; --muted:#64748b; --line:#dbe7f0; --card:#fff;
    --c-adult:#1e6fc4; --c-student:#6b4fbb; --c-senior:#c8402f; --c-child:#f0921d; --c-infant:#17876a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
       color:var(--ink);line-height:1.5;background:linear-gradient(180deg,#eefafd 0%,#d6eff7 60%,#bfe3f2 100%) fixed;
       padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto}

  header{position:relative;color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 20px;
         background:linear-gradient(rgba(5,40,70,.35),rgba(5,40,70,.82)),url(trip-xpark.jpg) center/cover}
  header .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;opacity:.9}
  header h1{margin:2px 0 8px;font-size:1.5rem}
  header .meta{display:flex;flex-wrap:wrap;gap:6px}
  header .meta span{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600}

  /* 統計 */
  .stats{margin:12px 14px 0;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(11,92,116,.08)}
  .stats .top{display:flex;align-items:baseline;justify-content:space-between}
  .stats .top b{font-size:2rem;color:var(--deep);line-height:1}
  .stats .top small{color:var(--muted);font-size:.8rem}
  .cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
  .cat{border-radius:12px;padding:8px 2px;text-align:center;background:#f4f8fb}
  .cat b{display:block;font-size:1.15rem}
  .cat span{display:block;font-size:.66rem;color:var(--muted);line-height:1.25}
  .k-adult b{color:var(--c-adult)} .k-student b{color:var(--c-student)} .k-senior b{color:var(--c-senior)}
  .k-child b{color:var(--c-child)} .k-infant b{color:var(--c-infant)}

  /* 查詢 + 篩選 */
  .sticky{position:sticky;top:0;z-index:10;background:rgba(232,246,250,.96);backdrop-filter:blur(6px);
          -webkit-backdrop-filter:blur(6px);padding:12px 14px 10px;margin-top:6px}
  .search{position:relative}
  .search input{width:100%;font-size:16px;padding:13px 44px 13px 42px;border:1.5px solid var(--line);
     border-radius:14px;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
  .search input:focus{border-color:var(--teal)}
  .search input::-webkit-search-cancel-button{display:none}
  .search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
  .search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#dfe7ee;
     color:#4a5560;width:30px;height:30px;border-radius:50%;display:none}
  .filters{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:none;border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;
     font-size:.84rem;font-weight:700;border-radius:999px;padding:8px 13px;min-height:38px}
  .filters button.on{background:var(--deep);border-color:var(--deep);color:#fff}

  /* 查詢結果 */
  #hit{margin:4px 14px 0;display:none}
  .hitcard{background:linear-gradient(135deg,var(--teal),var(--deep));color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:8px}
  .hitcard .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hitcard .nm{font-size:1.15rem;font-weight:800}
  .hitcard .pax{font-size:1.6rem;font-weight:800;white-space:nowrap}
  .hitcard .pax small{font-size:.9rem;margin-left:2px}
  .hitcard .mode{display:inline-block;margin-top:4px;font-size:.8rem;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px}
  .hitcard .tk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .hitcard .tk span{background:#fff;color:var(--ink);border-radius:10px;padding:4px 10px;font-size:.85rem;font-weight:700}
  .nohit{background:#fff;border-radius:14px;padding:14px;text-align:center;color:#b42318;font-weight:600}

  /* 名單 */
  .group{margin:12px 14px 0;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(11,92,116,.08)}
  .group h2{margin:0;padding:11px 16px;font-size:1rem;display:flex;justify-content:space-between;align-items:center;color:#fff}
  .g-bus h2{background:var(--navy)} .g-self h2{background:var(--teal)} .g-other h2{background:#7a5af0}
  .group h2 small{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;font-size:.8rem}
  .group .note{padding:8px 16px;font-size:.8rem;color:var(--muted);background:#f7fafc;border-bottom:1px solid var(--line)}
  .p{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);transition:background .3s}
  .p:first-of-type{border-top:0}
  .p .l{flex:1;min-width:0}
  .p .n{font-weight:700;font-size:1rem}
  .p .t{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .chip{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff}
  .chip.adult{background:var(--c-adult)} .chip.student{background:var(--c-student)} .chip.senior{background:var(--c-senior)}
  .chip.child{background:var(--c-child)} .chip.infant{background:var(--c-infant)}
  .p .tot{flex:none;min-width:52px;text-align:center;font-weight:800;background:#eef4f8;border-radius:10px;padding:5px 8px}
  .p.hl{background:#fff6a8}
  .group[hidden]{display:none}

  .legend{margin:14px 14px 0;display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.78rem;color:var(--muted)}
  .legend .chip{margin-right:3px}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:14px}

  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);
          backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);
          padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bottom a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:14px;
            text-decoration:none;font-weight:800;font-size:.92rem}
  .bottom .ghost{background:var(--sky);color:var(--deep)}
  .bottom .main{background:linear-gradient(135deg,var(--teal),var(--deep));color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">XPARK AQUARIUM</div>
    <h1>🐟 Xpark 入場名單</h1>
    <div class="meta"><span>⏰ 10:00 – 13:45</span><span>📍 置地廣場桃園</span></div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="sticky">
    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="輸入英文名字查詢" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clear" id="clear" aria-label="清除">✕</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div id="hit"></div>
  <div id="groups"></div>

  <div class="legend" id="legend"></div>
  <footer>人數含員工本人及眷屬</footer>
</div>

<div class="bottom"><div class="in">
  <a class="ghost" href="trip.html">🗓️ 行程</a>
  <a class="main" href="way.html#xpark">🧭 Xpark 交通</a>
</div></div>

<script>
/* ===== 票種 ===== */
const CATS = [
  { k:"adult",   label:"18-64歲" },
  { k:"student", label:"學生12-18" },
  { k:"senior",  label:"年滿65歲" },
  { k:"child",   label:"孩童4-12" },
  { k:"infant",  label:"未滿4歲" }
];
/* ===== 名單：["Name", 總人數, 18-64, 學生, 65+, 孩童, 未滿4] ===== */
const GROUPS = [
  { id:"bus", cls:"g-bus", label:"🚌 搭乘遊覽車", note:"13:45 集合上車，前往台茂",
    rows:[["Carole Yu",4,2,2],["Mina PH Lee",2,2],["Jimmy Yang",4,2,0,0,1,1],["Bert Hsu",1,1],["Janis Lee",1,1],
          ["Joseph Chen",3,2,0,0,0,1],["Venlen Liu",2,1,0,0,1],["Austin Chung",2,1,0,0,1],["Luka Chang",1,1],
          ["Diamo Cheng",1,1],["Brian Tran",1,1],["ShanYing Pan",1,1],["Dennis Tsai",3,2,0,0,1],["Sam Shiu",2,2],
          ["Alan Chou",1,1],["Arvin Liao",1,1],["Sanyo Shih",1,1],["Kilean Lee",3,2,0,0,1],["Wendy Hsieh",1,1],
          ["Alejandro Chang",2,2],["Michael Huang",1,1],["Mohd Azim",1,1],["Ned Ku",2,1,0,0,1],["John Chu",2,2],
          ["Hebe Tsai",2,1,1],["Monica Wu",4,3],["Benson Ho",1,1],["Karlie Wu",1,1],["Teresa Yu",2,1,1],
          ["Josh Lin",1,1],["Wolf Wang",1,1]] },
  { id:"self", cls:"g-self", label:"🚗 自行前往", note:"請自行前往 Xpark，交通方式請見「Xpark 交通」",
    rows:[["Mason Chiu",4,4],["Patrick Hsu",1,1],["Jackson Lin",4,4],["Jenny Wang",2,2],["Jerry Hung",3,2,0,0,0,1],
          ["Ivy Huang",2,2],["Louis HC Lin",1,1],["Vincent Chang",4,2,1,0,1],["Rex Chou",4,2,0,0,2],["Mike Ni",2,2],
          ["Frank Cheng",2,2],["Bright Ding",2,2],["Clifford Lo",1,1],["Andrea Carolina",2,2],["Locus Fan",4,2,0,0,0,2],
          ["Tom Lin",2,2],["Coby Mong",3,2,0,0,0,1],["Wynne Fang",1,1],["Alma Chen",2,2],["Corrine Feng",4,2,0,0,1,1],
          ["Eric CY Li",3,2,0,0,1],["Richard Liu",1,1],["Chris Yan",1,1],["Carol Chiu",2,1,0,0,0,1],["Xavier Wang",2,2],
          ["Pohsun Chen",3,2,0,0,0,1],["Jerry LJ Chen",4,2,0,0,2],["Grace Tien",5,1,0,0,2,1],["Jill Chen",4,3,0,0,0,1],
          ["Kevin Huang",1,1],["Max KC Chen",2,2],["Michelle Chiu",3,2,0,0,0,1],["YunHan Wang",4,2,0,2,0,1],
          ["Nora Hsu",4,2,0,0,1,1],["ChienChung Li",2,1,0,1],["Abbie Liu",2,2],["Bella Wang",2,2],["Jessie Dai",2,2],
          ["Rainy Huang",4,2,0,0,1,1],["Summer Lu",3,2,0,0,1],["Ivy Wu",5,3,0,2,0,1],["Teresa Sf Liu",5,2,1,0,2]] },
  { id:"other", cls:"g-other", label:"⏰ 其他時段進出", note:"自行前往，於其他時段進出",
    rows:[["Ann Nguyen",2,1,0,0,1],["Gavin Yang",4,2,0,2]] }
];
/* ========================================== */

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sumCol = (rows,i) => rows.reduce((s,r)=>s+(r[i]||0),0);
const chips = r => CATS.map((c,i)=>r[i+2]?`<span class="chip ${c.k}">${c.label} ×${r[i+2]}</span>`:"").join("");

// 統計（主名單＝遊覽車＋自行前往；其他時段另計）
const main = GROUPS.filter(g=>g.id!=="other").flatMap(g=>g.rows);
const other = GROUPS.find(g=>g.id==="other").rows;
document.getElementById("stats").innerHTML = `
  <div class="top"><div><small>總人數</small><br><b>${sumCol(main,1)}</b> 人</div>
    <small>另有其他時段進出 ${sumCol(other,1)} 人</small></div>
  <div class="cats">${CATS.map((c,i)=>`<div class="cat k-${c.k}"><b>${sumCol(main,i+2)}</b><span>${c.label}</span></div>`).join("")}</div>`;

document.getElementById("legend").innerHTML = CATS.map(c=>`<span><span class="chip ${c.k}">${c.label}</span></span>`).join("");

// 篩選按鈕
const filters = document.getElementById("filters");
const fdefs = [{id:"all",label:"全部"},...GROUPS.map(g=>({id:g.id,label:`${g.label} ${sumCol(g.rows,1)}`}))];
filters.innerHTML = fdefs.map(f=>`<button data-f="${f.id}">${f.label}</button>`).join("");
let current = "all";
function setFilter(f){
  current = f;
  filters.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.f===f));
  document.querySelectorAll(".group").forEach(g=>g.hidden = !(f==="all" || g.dataset.g===f));
}
filters.onclick = e => { const b=e.target.closest("button"); if(b) setFilter(b.dataset.f); };

// 名單
const ALL = [];
document.getElementById("groups").innerHTML = GROUPS.map(g=>`
  <section class="group ${g.cls}" data-g="${g.id}">
    <h2>${g.label}<small>${g.rows.length} 組・${sumCol(g.rows,1)} 人</small></h2>
    <div class="note">${esc(g.note)}</div>
    ${g.rows.map(r=>{ ALL.push({g,r});
      return `<div class="p" data-name="${esc(r[0].toLowerCase())}">
        <div class="l"><div class="n">${esc(r[0])}</div><div class="t">${chips(r)}</div></div>
        <div class="tot">${r[1]} 人</div></div>`;}).join("")}
  </section>`).join("");
setFilter("all");

// 查詢
const q=document.getElementById("q"), clr=document.getElementById("clear"), hit=document.getElementById("hit");
function search(){
  const v=q.value.trim().toLowerCase().replace(/\s+/g," ");
  clr.style.display = v ? "block" : "none";
  document.querySelectorAll(".p.hl").forEach(p=>p.classList.remove("hl"));
  if(!v){ hit.style.display="none"; hit.innerHTML=""; return; }
  const hs = ALL.filter(x=>x.r[0].toLowerCase().includes(v));
  hit.style.display="block";
  if(!hs.length){ hit.innerHTML=`<div class="nohit">找不到「${esc(q.value.trim())}」，請確認英文拼字 🙏</div>`; return; }
  setFilter("all");
  hit.innerHTML = hs.slice(0,5).map(x=>`
    <div class="hitcard">
      <div class="row1"><div><div class="nm">${esc(x.r[0])}</div><span class="mode">${x.g.label}</span></div>
        <div class="pax">${x.r[1]}<small>人</small></div></div>
      <div class="tk">${CATS.map((c,i)=>x.r[i+2]?`<span>${c.label} × ${x.r[i+2]}</span>`:"").join("")}</div>
    </div>`).join("") + (hs.length>5?`<div class="nohit" style="color:var(--muted)">還有 ${hs.length-5} 筆，請輸入更完整的名字</div>`:"");
  hs.forEach(x=>{ const el=document.querySelector(`.group[data-g="${x.g.id}"] .p[data-name="${CSS.escape(x.r[0].toLowerCase())}"]`); if(el) el.classList.add("hl"); });
}
q.addEventListener("input",search);
q.addEventListener("keydown",e=>{ if(e.key==="Enter") q.blur(); });
clr.onclick=()=>{ q.value=""; search(); q.focus(); };
</script>
</body>
</html>
